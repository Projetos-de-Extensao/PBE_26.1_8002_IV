  /api/relatorios/:
    get:
      operationId: relatorios_list
      description: |-
        Disponibiliza operações CRUD para
        relatórios semestrais de estágio.

        Também disponibiliza ações para:
        - Aprovação
        - Reprovação

        Utiliza select_related para otimizar
        consultas dos relacionamentos.
      parameters:
      - in: query
        name: coordenador
        schema:
          type: integer
      - in: query
        name: estagio
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: semestre
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Status do Relatório
          enum:
          - aprovado
          - pendente
          - reprovado
        description: |-
          * `pendente` - Pendente
          * `aprovado` - Aprovado
          * `reprovado` - Reprovado
      tags:
